<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Team Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-screen">
  <main class="login-card">
    <p class="eyebrow">Secure team access</p>
    <h1>Forgot password</h1>
    {% if sent %}
    <p class="notice">If that email is registered, a reset link has been sent. Check your inbox.</p>
    {% else %}
    <form method="post" action="/forgot-password" class="stack">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <button type="submit">Send reset link</button>
    </form>
    {% endif %}
    <p class="auth-links"><a href="/login">Back to sign in</a></p>
  </main>
</body>
</html>
