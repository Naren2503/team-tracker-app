<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Team Tracker</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-screen">
  <main class="login-card">
    <p class="eyebrow">Secure team access</p>
    <h1>Reset password</h1>
    <form method="post" action="/reset-password" class="stack">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
      <label>Confirm password<input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></label>
      <button type="submit">Reset password</button>
    </form>
    <p class="auth-links"><a href="/login">Back to sign in</a></p>
  </main>
</body>
</html>
