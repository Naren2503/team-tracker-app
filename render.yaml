services:
  - type: web
    name: naren-tracker-launch
    runtime: static
    buildCommand: echo "Static launch page ready"
    staticPublishPath: ./launch

  - type: web
    name: naren2503-team-tracker
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
